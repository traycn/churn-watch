name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - name: Published scores reproduce from the response cache (no API key)
        run: |
          uv run churnwatch eval --replay
          git diff --exit-code -- evals/results.csv || (echo "::error::Replayed scores differ from evals/results.csv" && exit 1)
