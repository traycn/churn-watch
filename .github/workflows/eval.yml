name: eval

# Re-score the test set whenever something that can change the scores changes:
# a prompt, the model list or settings, the scoring code, or the labels.
on:
  push:
    branches: [main]
    paths:
      - "prompts/**"
      - "evals/config.toml"
      - "src/**"
      - "data/testset/**"
  workflow_dispatch:

# Paid runs happen only on main, one at a time, so there is exactly one spend ledger
# (evals/spend.csv) and two runs can never both see the same remaining budget.
# Pull requests get the free replay check in test.yml instead.

permissions:
  contents: write

concurrency:
  group: paid-eval
  cancel-in-progress: false

jobs:
  eval:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --extra dev

      - name: Check the API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Budget before
        run: uv run churnwatch budget || true

      - name: Run evals (cached responses are free; refused if the worst case would pass the cap)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run churnwatch eval

      - name: Post the results and spend to the job summary
        if: always()
        run: |
          echo '## Spend' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run churnwatch budget >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "## Evaluation results" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/RESULTS:START/,/RESULTS:END/p' README.md | sed '1d;$d' >> "$GITHUB_STEP_SUMMARY"

      # Runs even if the eval step failed part-way, so every paid call stays in the ledger.
      - name: Commit updated scores, cache and spend ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/ README.md
          if git diff --cached --quiet; then
            echo "Scores unchanged."
          else
            git commit -m "eval: update scores for ${GITHUB_SHA::7} [skip ci]"
            git pull --rebase origin main
            git push
          fi
