name: demo

# Score the 200-account demo export with the default model and publish the report.
# Run by hand from the Actions tab. Shares the paid-eval queue and spend ledger.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paid-eval
  cancel-in-progress: false

jobs:
  demo:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Score the demo export (refused if the worst case would pass the cap)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run churnwatch score data/accounts.csv --model claude-haiku-5-5 --prompt v2 --out docs/sample
      - name: Spend
        if: always()
        run: uv run churnwatch budget | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Commit report, cache and spend ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sample evals/
          if ! git diff --cached --quiet; then
            git commit -m "demo: score data/accounts.csv [skip ci]"
            git pull --rebase origin main
            git push
          fi
