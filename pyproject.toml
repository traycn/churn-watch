[project]
name = "churn-watch"
version = "0.1.0"
description = "An LLM agent that flags at-risk customer accounts from a CRM export and explains why, with an evaluation suite."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.70",
    "pydantic>=2.8",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
churnwatch = "churnwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churnwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
