# Engine-wide evaluation settings. Each pack can override `runs` and `demo` in its
# own pack.toml [evals] section. Any change here, in prompts/ or in packs/ re-runs the
# evals in CI (cached responses are reused, so only what changed costs money).

max_tokens = 4000  # includes thinking tokens on models that think by default
temperature = 0
concurrency = 8

[defaults]
# The (model/prompt) runs scored on every pack's 50-account test set. The rules
# baseline always runs too and is free. Sonnet runs only on the final prompt, to keep
# a pack at roughly $2.50 worst case.
runs = ["claude-haiku-5-5/v1", "claude-haiku-5-5/v2", "claude-sonnet-5-5/v2"]
# The run that scores the pack's 200-account demo export for the published report.
demo = "claude-haiku-5-5/v2"

[budget]
# Hard cap on total API spend for the whole repo (all packs), in USD. Every paid call
# is logged in evals/spend.csv. A run is refused before anything is sent if its worst
# case, plus spend so far, plus the worst case of every pack's unfinished required runs
# (its `runs` and its `demo`), would pass the cap. See src/churnwatch/budget.py.
cap_usd = 25.00

# USD per million tokens, standard API.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (checked 2026-11-17).
# Haiku 5.5 prices are for prompts of 100K tokens or less, which every request here is.
[prices.claude-haiku-5-5]
input = 0.10
output = 0.50

[prices.claude-sonnet-5-5]
input = 2.00
output = 10.00
